<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive project depth scene</title>
    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module">
      import { Application } from "https://cdn.jsdelivr.net/npm/@splinetool/runtime@1.12.98/+esm";

      const canvas = document.querySelector("#scene");
      const app = new Application(canvas);
      await app.load("https://prod.spline.design/Slk6b8kz3LRlKiyk/scene.splinecode");
    </script>
  </body>
</html>
